name: Validate public source package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/build.py
      - run: python tools/check_content.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/workflows.py
      - name: Check NASA-punk publication archive
        run: python tools/check_nasa_punk.py --check-only
      - name: Ensure committed outputs are reproducible
        run: git diff --exit-code -- projects workflows reports
