<script>
const film = document.getElementById('film');
const play = document.getElementById('play');
const status = document.getElementById('status');
play.addEventListener('click', async () => {

  if (film.ended) film.currentTime = 0;
  try { await film.play(); film.scrollIntoView({behavior:'smooth',block:'center'}); }
  catch (error) { status.textContent = '暂时无法播放，请尝试播放器的播放按钮，或下方“直接打开 MP4”链接。'; }
});
film.addEventListener('play', () => { play.textContent = 'Ⅱ 暂停播放'; status.textContent = '正在播放（无声版）。'; });

film.addEventListener('error', () => { status.textContent = '视频加载失败，请尝试下方“直接打开 MP4”链接。'; });
</script>
