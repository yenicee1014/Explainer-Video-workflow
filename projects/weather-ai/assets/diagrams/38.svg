<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="再分析，也不是完美真值"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">38 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 08 章   如何评价与使用预报</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">再分析，也不是完美真值</text><text x="110" y="625" font-size="36" fill="#DA291C" font-weight="700" text-anchor="start">回看历史：采用较一致的分析系统</text><g class="reveal" data-at="0.12"><rect x="110" y="700" width="380" height="140" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="140" y="755.0" font-size="32" fill="#181818" font-weight="400" text-anchor="start">历史观测及质量控制</text><rect x="590" y="700" width="380" height="140" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="620" y="755" font-size="32" fill="#181818" font-weight="400" text-anchor="start">模式与同化方法</text><text x="620" y="805" font-size="32" fill="#181818" font-weight="400" text-anchor="start">误差描述</text></g><g class="reveal" data-at="0.27"><path d="M300 850 L430 980" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 850 L650 980" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="990" width="700" height="145" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="235" y="1075" font-size="42" fill="#181818" font-weight="700" text-anchor="start">历史大气状态估计</text></g><g class="reveal" data-at="0.42"><path d="M160,1250 L930,1250" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="160" y="1325" font-size="36" fill="#181818" font-weight="400" text-anchor="start">过去时刻 1 → 2 → 3 → …</text><text x="160" y="1430" font-size="32" fill="#57544F" font-weight="400" text-anchor="start">时间连续的资料集 ≠ 无误差真值</text></g><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">再分析是历史状态估计，不标成无误差的真实大气。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 A1, D1, V1, A2</text></svg>