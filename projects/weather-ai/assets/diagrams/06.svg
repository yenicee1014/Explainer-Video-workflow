<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="观测网，不是全天候全知"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">06 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 02 章   从观测到初始状态</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">观测网，不是全天候全知</text><path d="M100,1240 L980,1240" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><g class="reveal" data-at="0.12"><circle cx="220" cy="1100" r="35" fill="#DA291C" stroke="#DA291C" stroke-width="3"/><path d="M220,1140 L220,1235" fill="none" stroke="#C8C2B8" stroke-width="2" stroke-dasharray="8 10"/><text x="220" y="1030" font-size="32" fill="#181818" font-weight="400" text-anchor="middle">局地测量</text><text x="110" y="1330" font-size="34" fill="#181818" font-weight="400" text-anchor="start">地面站：近地面</text></g><g class="reveal" data-at="0.27"><circle cx="530" cy="920" r="35" fill="#DA291C" stroke="#DA291C" stroke-width="3"/><path d="M530,960 L530,1235" fill="none" stroke="#C8C2B8" stroke-width="2" stroke-dasharray="8 10"/><text x="530" y="850" font-size="32" fill="#181818" font-weight="400" text-anchor="middle">体积采样</text><text x="110" y="1385" font-size="34" fill="#181818" font-weight="400" text-anchor="start">雷达：回波等</text></g><g class="reveal" data-at="0.42"><circle cx="840" cy="700" r="35" fill="#DA291C" stroke="#DA291C" stroke-width="3"/><path d="M840,740 L840,1235" fill="none" stroke="#C8C2B8" stroke-width="2" stroke-dasharray="8 10"/><text x="840" y="630" font-size="32" fill="#181818" font-weight="400" text-anchor="middle">辐射视场</text><text x="110" y="1440" font-size="34" fill="#181818" font-weight="400" text-anchor="start">卫星：辐射等</text></g><text x="110" y="610" font-size="34" fill="#57544F" font-weight="400" text-anchor="start">多种观测量 → 共同约束状态</text><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">不同仪器观测量不同；图中不以连线暗示全域直接测量。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 O1, R1, S1</text></svg>