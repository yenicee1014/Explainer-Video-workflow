sharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">尺度与提前量共同影响可预报性，不能只按大小排序。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 M1, N1</text></svg>