<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="AI学习的，是演变关系"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">21 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 05 章   AI究竟改变了什么</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">AI学习的，是演变关系</text><text x="110" y="620" font-size="38" fill="#DA291C" font-weight="700" text-anchor="start">训练：从历史资料学习</text><g class="reveal" data-at="0.12"><rect x="110" y="680" width="360" height="135" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="135" y="730.0" font-size="32" fill="#181818" font-weight="400" text-anchor="start">历史状态与对应目标</text><rect x="610" y="680" width="360" height="135" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="650" y="760" font-size="36" fill="#181818" font-weight="700" text-anchor="start">模型训练</text><path d="M480 748 L598 748" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/></g><g class="reveal" data-at="0.27"><path d="M790 830 L790 1000" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><text x="110" y="960" font-size="38" fill="#DA291C" font-weight="700" text-anchor="start">推理：输入当前状态</text></g><g class="reveal" data-at="0.42"><rect x="110" y="1020" width="360" height="140" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="135" y="1075.0" font-size="34" fill="#181818" font-weight="400" text-anchor="start">当前初始状态</text><rect x="610" y="1020" width="360" height="140" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="645" y="1100" font-size="34" fill="#181818" font-weight="700" text-anchor="start">已训练模型</text><path d="M480 1090 L598 1090" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/></g><g class="reveal" data-at="0.57"><path d="M790 1170 L790 1240" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="1250" width="580" height="120" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="430" y="1325" font-size="34" fill="#181818" font-weight="700" text-anchor="start">未来状态或概率分布</text></g><text x="110" y="1450" font-size="29" fill="#57544F" font-weight="400" text-anchor="start">训练与推理是两个阶段，不是现场重新学一遍</text><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">训练与推理分开展示；不同AI架构和训练资料有所不同。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 E1, A1, A2</text></svg>