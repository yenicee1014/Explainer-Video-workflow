<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="有效时间，不等于发布时间"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">03 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 01 章   怎样才算报准</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">有效时间，不等于发布时间</text><text x="110" y="630" font-size="40" fill="#181818" font-weight="700" text-anchor="start">模式起报 → 目标时刻</text><path d="M140,940 L950,940" fill="none" stroke="#181818" stroke-width="4" stroke-dasharray=""/><g class="reveal" data-at="0.12"><circle cx="180" cy="940" r="12" fill="#DA291C" stroke="#DA291C" stroke-width="3"/><text x="180" y="1020" font-size="34" fill="#181818" font-weight="400" text-anchor="middle">起报</text><circle cx="380" cy="940" r="9" fill="#181818" stroke="#181818" stroke-width="3"/><text x="380" y="1020" font-size="32" fill="#181818" font-weight="400" text-anchor="middle">产品发布</text></g><g class="reveal" data-at="0.27"><rect x="700" y="880" width="230" height="120" fill="none" stroke="#DA291C" stroke-width="3"/><text x="815" y="1070" font-size="34" fill="#DA291C" font-weight="700" text-anchor="middle">有效时段</text><path d="M815,880 L815,1000" fill="none" stroke="#DA291C" stroke-width="2" stroke-dasharray="8 8"/></g><g class="reveal" data-at="0.42"><path d="M180 775 L815 775" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><path d="M180,790 L180,900" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><path d="M815,790 L815,860" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="480" y="725" font-size="32" fill="#DA291C" font-weight="700" text-anchor="middle">到该目标时刻的预报提前量</text></g><text x="110" y="1270" font-size="30" fill="#57544F" font-weight="400" text-anchor="start">提前量以起报时刻为基点，不以打开手机为基点</text><text x="110" y="1370" font-size="30" fill="#57544F" font-weight="400" text-anchor="start">有效时段内的其他目标时刻，提前量也不同</text><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">时间线仅示意；应用发布时间可能晚于模式起报时间。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 V1, E1</text></svg>