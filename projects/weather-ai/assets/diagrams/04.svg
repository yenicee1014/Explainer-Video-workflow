<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="三种偏差，不能混为一谈"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">04 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 01 章   怎样才算报准</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">三种偏差，不能混为一谈</text><g class="reveal" data-at="0.12"><text x="110" y="670" font-size="38" fill="#181818" font-weight="700" text-anchor="start">位置：两块雨区的落点</text><circle cx="500" cy="790" r="65" fill="none" stroke="#181818" stroke-width="3"/><circle cx="640" cy="790" r="65" fill="none" stroke="#DA291C" stroke-width="3"/><path d="M510 890 L640 890" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/></g><g class="reveal" data-at="0.27"><text x="110" y="980" font-size="38" fill="#181818" font-weight="700" text-anchor="start">时间：同一地点的到达时刻</text><path d="M400,1120 L920,1120" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><path d="M400 1120 H470 L530 1020 L590 1120 H920" fill="none" stroke="#181818" stroke-width="4"/><path d="M400 1120 H660 L720 1020 L780 1120 H920" fill="none" stroke="#DA291C" stroke-width="4"/></g><g class="reveal" data-at="0.42"><text x="110" y="1270" font-size="38" fill="#181818" font-weight="700" text-anchor="start">强度：同一时窗的雨量差异</text><rect x="440" y="1330" width="310" height="32" fill="#181818" stroke="#181818" stroke-width="2"/><rect x="440" y="1390" width="190" height="32" fill="#DA291C" stroke="#DA291C" stroke-width="2"/></g><text x="110" y="1475" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">黑／红为参照与偏差示意，不含真实量值</text><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">概念示意：轮廓非实测，不模拟真实雨团的完整演变。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 V1</text></svg>