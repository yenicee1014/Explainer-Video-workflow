<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-label="一场雷阵雨，需要一连串条件"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#181818" stroke-width="1.3"/></marker></defs><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif} .reveal{transition:none}</style><rect x="0" y="0" width="1080" height="1920" fill="#F1EEE7" stroke="#F1EEE7" stroke-width="2"/><rect x="72" y="80" width="14" height="48" fill="#DA291C" stroke="#DA291C" stroke-width="2"/><text x="110" y="117" font-size="32" fill="#181818" font-weight="700" text-anchor="start">天气预报 / 科学解读</text><text x="1008" y="117" font-size="28" fill="#57544F" font-weight="400" text-anchor="end">26 / 40</text><path d="M72,165 L1008,165" fill="none" stroke="#181818" stroke-width="3" stroke-dasharray=""/><text x="72" y="232" font-size="30" fill="#DA291C" font-weight="700" text-anchor="start">第 06 章   一场局地雨的难题</text><text x="72" y="340.0" font-size="76" fill="#181818" font-weight="400" text-anchor="start">一场雷阵雨，需</text><text x="72" y="450.2" font-size="76" fill="#181818" font-weight="400" text-anchor="start">要一连串条件</text><text x="110" y="620" font-size="36" fill="#DA291C" font-weight="700" text-anchor="start">环境条件共同作用，不是串行步骤</text><g class="reveal" data-at="0.12"><rect x="110" y="700" width="400" height="125" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="310" y="777" font-size="36" fill="#181818" font-weight="700" text-anchor="middle">水汽供给</text><rect x="570" y="700" width="400" height="125" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="770" y="777" font-size="36" fill="#181818" font-weight="700" text-anchor="middle">热力不稳定</text></g><g class="reveal" data-at="0.27"><rect x="110" y="1100" width="400" height="125" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="310" y="1177" font-size="36" fill="#181818" font-weight="700" text-anchor="middle">抬升与触发</text><rect x="570" y="1100" width="400" height="125" fill="none" stroke="#C8C2B8" stroke-width="2"/><text x="770" y="1177" font-size="36" fill="#181818" font-weight="700" text-anchor="middle">风场环境</text></g><g class="reveal" data-at="0.42"><path d="M310 835 L460 915" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 835 L620 915" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><path d="M310 1090 L460 1015" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 1090 L620 1015" fill="none" stroke="#181818" stroke-width="3" marker-end="url(#arrow)"/><circle cx="540" cy="965" r="90" fill="none" stroke="#181818" stroke-width="3"/><text x="540" y="950" font-size="30" fill="#181818" font-weight="700" text-anchor="middle">共同影响</text><text x="540" y="997" font-size="30" fill="#181818" font-weight="700" text-anchor="middle">对流发展</text></g><text x="110" y="1360" font-size="30" fill="#57544F" font-weight="400" text-anchor="start">云雨微物理影响降水；风场影响组织和移动</text><text x="110" y="1450" font-size="32" fill="#DA291C" font-weight="700" text-anchor="start">满足部分条件 ≠ 雷暴必然发生</text><path d="M72,1530 L1008,1530" fill="none" stroke="#C8C2B8" stroke-width="3" stroke-dasharray=""/><text x="72" y="1760.0" font-size="28" fill="#57544F" font-weight="400" text-anchor="start">环境条件共同影响对流，非串行工序；满足部分条件不保证雷暴发生。</text><text x="72" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="start">原理示意 / 非真实天气数据</text><text x="1008" y="1870" font-size="26" fill="#57544F" font-weight="400" text-anchor="end">依据 N1, T1</text></svg>